[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freehand-agent"
version = "0.1.8"
description = "FreeHand — Local AI agent with Tailscale access, OAuth integrations, and cross-agent memory import"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tracy Smith", email = "tracy@tracysmith.co.za" },
]
keywords = ["ai", "agent", "oauth", "local", "tailscale", "gmail", "zoom", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "typer>=0.9.0",
    "apscheduler>=3.10",
    "aiohttp>=3.9",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "authlib>=1.3.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "fastapi[test]",
    "httpx>=0.27",
    "build",
    "twine",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
freehand = "cli:app"

[project.urls]
Homepage = "https://freehand.tracysmith.co.za"
Documentation = "https://github.com/TracySmithConsulting/freehand#readme"
Repository = "https://github.com/TracySmithConsulting/freehand"
Issues = "https://github.com/TracySmithConsulting/freehand/issues"
Changelog = "https://github.com/TracySmithConsulting/freehand/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["core*", "freehand*"]

[tool.setuptools]
py-modules = ["cli", "server"]

[tool.setuptools.package-data]
freehand = ["static/*", "static/*/*", "bridge/*", "bridge/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
