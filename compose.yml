# FreeHand × OpenConnector — joint bring-up
#
# Two services, one shared vault volume, healthchecks on both so
# FreeHand waits for OC to be ready before starting.
#
# Usage:
#   python scripts/setup_env.py   # creates .env with random passwords
#   docker compose up -d       # bring up both services in background
#   docker compose logs -f     # tail logs from both
#   docker compose down        # stop (vault volume preserved)
#   docker compose down -v     # stop AND wipe vault (data loss!)
#
# Service map:
#   open-connector  :3001  — Node OC runtime (ghcr.io/oomol-lab/open-connector)
#   freehand        :8000  — Python FreeHand (built from local Dockerfile)
#
# Vault persistence:
#   ./vault → /app/vault — host directory mounted into both services.
#   FreeHand writes encryption.key + connections.db + broker_config.json
#   there. OC writes its own SQLite store (connect.sqlite) at /app/data
#   inside its container, kept in the named volume freehand-oc-data.
#   Don't confuse the two — only ./vault is bind-mounted.
#
# Health checks:
#   OC: wget /health  (returns 200 OK)
#   FreeHand: Python urllib against its own root  (returns HTML)
#
# Production hardening (out of scope for this compose file):
#   - scripts/setup_env.py generates the OpenConnector secrets; compose
#     refuses to start without them (there are no built-in defaults)
#   - Consider external Postgres for OC (replace SQLite with the
#     postgres image, wire DATABASE_URL)
#   - FreeHand's vault encryption key is auto-generated on first
#     startup if missing; for production, generate via
#     `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`
#     and seed vault/encryption.key before first boot.

services:
  # ── OpenConnector runtime ──────────────────────────────────────────
  open-connector:
    # Pinned by digest so every install runs the version that was tested;
    # ":latest" changes underneath you. Keep in step with OC_IMAGE in
    # scripts/provision_tenant.py. To upgrade: docker pull
    # ghcr.io/oomol-lab/open-connector:latest, test it, then copy the new
    # digest from `docker image inspect --format "{{.RepoDigests}}"`.
    image: ghcr.io/oomol-lab/open-connector@sha256:61e5e29a9ae7d8e817e8050d062ed57134e069cea3e7eef7cb15349c11b7a76d
    container_name: freehand-open-connector
    restart: unless-stopped
    # 127.0.0.1 keeps OC off the network. If FreeHand is later reachable
    # over Tailscale, opt in to LAN exposure via HOST=0.0.0.0 in .env.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      # The exact address people open the OC console at. OC builds its
      # OAuth callback (<origin>/oauth/callback) from it, and refuses
      # sign-ins from any other origin (localhost and 127.0.0.1 differ).
      # Unset, OC assumed http://localhost:<PORT> while FreeHand linked to
      # http://127.0.0.1:3001, so sign-ins could not complete.
      - OOMOL_CONNECT_ORIGIN=${OOMOL_CONNECT_CONSOLE_URL:-http://localhost:3001}
      # No defaults: the old built-in test values were public. Compose
      # stops with a message if .env doesn't set these.
      - OOMOL_CONNECT_ADMIN_TOKEN=${OC_ADMIN_TOKEN:?OC_ADMIN_TOKEN is not set - run python scripts/setup_env.py}
      - OOMOL_CONNECT_RUNTIME_TOKEN=${OC_RUNTIME_TOKEN:?OC_RUNTIME_TOKEN is not set - run python scripts/setup_env.py}
      - OOMOL_CONNECT_ENCRYPTION_KEY=${OC_ENCRYPTION_KEY:?OC_ENCRYPTION_KEY is not set - run python scripts/setup_env.py}
    volumes:
      # OC's own SQLite store. OC keeps it in /app/data (its
      # OOMOL_CONNECT_DATA_DIR). This used to mount /data, which OC never
      # uses, so its data sat in an unnamed volume and a new, empty one
      # was created whenever the container was rebuilt.
      - oc-data:/app/data
    # IPv4 only. On some networks Docker's DNS hands back only IPv6
    # addresses for login.microsoftonline.com, but the container has no
    # IPv6 route, so Microsoft sign-ins failed with ENETUNREACH.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      # OC's /health endpoint returns {"ok": true} when ready.
      # wget --spider does a HEAD request, which OC handles correctly.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # OC's npm install + catalog generation can take 20-30s on first
      # boot. start_period gives it room without spamming retries.
      start_period: 30s

  # ── Hindsight: FreeHand's long-term memory ───────────────────────
  # Stores what FreeHand learns, with no size limit, and recalls what
  # matters for each message (core/long_memory.py). Its database lives in
  # the hindsight-data volume. The first start downloads its search models,
  # which can take a few minutes; FreeHand works meanwhile, without memory.
  hindsight:
    # Pinned by digest, like open-connector. To upgrade: docker pull
    # ghcr.io/vectorize-io/hindsight:latest, test it, copy the new digest.
    image: ghcr.io/vectorize-io/hindsight@sha256:50311d02b4d5d2b7c5242bd336edf8735df8374eaad496a92f49c83b37d2aa06
    container_name: freehand-hindsight
    restart: unless-stopped
    # This computer only: the API (8888) and Hindsight's own console (9999)
    # have no password. Other apps on this computer (Hermes) can share it.
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    environment:
      # Hindsight's AI model is FreeHand's: FreeHand passes these requests
      # on to the model set up in Settings (server.py /internal/llm/v1), so
      # people set a model up once. To give memory its own model instead,
      # set HINDSIGHT_LLM_BASE_URL, HINDSIGHT_LLM_API_KEY and
      # HINDSIGHT_LLM_MODEL in .env.
      - HINDSIGHT_API_LLM_PROVIDER=openai
      - HINDSIGHT_API_LLM_BASE_URL=${HINDSIGHT_LLM_BASE_URL:-http://freehand:8000/internal/llm/v1}
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_LLM_API_KEY:-${FREEHAND_LLM_PROXY_TOKEN:?FREEHAND_LLM_PROXY_TOKEN is not set - run python scripts/setup_env.py}}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_LLM_MODEL:-freehand}
      - HINDSIGHT_API_WORKER_ID=freehand
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  # ── FreeHand ──────────────────────────────────────────────────────
  freehand:
    build:
      context: .
      dockerfile: Dockerfile
      # Match the in-container freehand user to your host user so the
      # bind-mounted vault (which now includes agent.db, encryption.key,
      # connections.db, broker_config.json, credential_store.json) is
      # writable. Override via `UID=$(id -u) GID=$(id -g) docker compose build`.
      #
      # Round 10 PR 1 note: the Round 9 agent.db bind-mount caveat is
      # resolved — agent.db now lives at vault/agent.db and the whole
      # vault directory is mounted as one volume. No Windows workaround
      # needed for the agent.db path. The FREEHAND_USER override below
      # remains as a Windows-host fallback for users who want to run as
      # root inside the container.
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: freehand-app
    restart: unless-stopped
    # Override the in-container user. Default to root (UID 0:0) for
    # Windows-host compatibility. Linux hosts should override via
    # `user: "${UID:-1000}:${GID:-1000}"` in their .env-driven override
    # or via a docker-compose.override.yml.
    user: "${FREEHAND_USER:-0:0}"
    depends_on:
      open-connector:
        # Don't start FreeHand until OC is healthy. avoids the
        # boot-time race where FreeHand's first OC probe 502s.
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # FreeHand talks to OC via the service name (compose's internal
      # DNS). NOT localhost — that would resolve to FreeHand's own
      # container, not OC's.
      - OOMOL_CONNECT_BASE_URL=http://open-connector:3001
      # Browser-facing OC console URL. This must be reachable from the
      # user's browser; the internal service name above is not.
      # Override this for a hosted deployment, e.g.
      # https://connect.example.com.
      - OOMOL_CONNECT_CONSOLE_URL=${OOMOL_CONNECT_CONSOLE_URL:-http://localhost:3001}
      - OOMOL_CONNECT_RUNTIME_TOKEN=${OC_RUNTIME_TOKEN:?OC_RUNTIME_TOKEN is not set - run python scripts/setup_env.py}
      # Lets Connect start OC sign-ins itself, so people go straight to
      # Google or Microsoft instead of OC's admin-token page.
      - OOMOL_CONNECT_ADMIN_TOKEN=${OC_ADMIN_TOKEN:?OC_ADMIN_TOKEN is not set - run python scripts/setup_env.py}
      # Optional: Composio-managed Meta authentication. These stay unset
      # unless Facebook/Instagram should use the Composio adapter.
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY:-}
      - COMPOSIO_AUTH_CONFIG_FACEBOOK=${COMPOSIO_AUTH_CONFIG_FACEBOOK:-}
      - COMPOSIO_AUTH_CONFIG_INSTAGRAM=${COMPOSIO_AUTH_CONFIG_INSTAGRAM:-}
      - COMPOSIO_BASE_URL=${COMPOSIO_BASE_URL:-https://backend.composio.dev}
      # The WhatsApp bridge runs on the host (npm start in freehand/bridge).
      # Inside this container 127.0.0.1 is the container, so reach the host.
      - FREEHAND_BRIDGE_URL=${FREEHAND_BRIDGE_URL:-http://host.docker.internal:8765}
      # Long-term memory: the hindsight service above. When it isn't
      # running, FreeHand still works, without long-term memory.
      - FREEHAND_HINDSIGHT_URL=${FREEHAND_HINDSIGHT_URL:-http://hindsight:8888}
      - FREEHAND_MEMORY_BANK=${FREEHAND_MEMORY_BANK:-freehand}
      # Shared with hindsight: lets it use FreeHand's AI model.
      - FREEHAND_LLM_PROXY_TOKEN=${FREEHAND_LLM_PROXY_TOKEN:?FREEHAND_LLM_PROXY_TOKEN is not set - run python scripts/setup_env.py}
    extra_hosts:
      # Docker Desktop provides host.docker.internal; Linux needs this line.
      - "host.docker.internal:host-gateway"
    # IPv4 only, as for open-connector above.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      # Mount the host's vault directory so encryption.key, connections.db,
      # broker_config.json, credential_store.json, AND agent.db all
      # persist across container restarts. agent.db now lives at
      # vault/agent.db (Round 10 PR 1) — one mount covers everything.
      # The image's chown -R freehand:freehand /app/vault makes the
      # empty volume writable; bind-mount overlays that ownership.
      - ./vault:/app/vault
    healthcheck:
      # uvicorn returns the FreeHand HTML index at /. A 200 there
      # means the server bound and the lifespan startup_event ran
      # (i.e. vault/agent.db is writable and the one-time
      # migrate_legacy_root_db() succeeded).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ── Caddy (reverse proxy / TLS / basic auth) ──────────────────────────
  # Optional: this profile is off by default. Enable it with
  #   docker compose --profile proxy up -d
  # for a single-tenant box where FreeHand should be reachable over HTTPS
  # with basic auth in front of it.
  #
  # Multi-tenant boxes do NOT use this service. scripts/provision_tenant.py
  # writes each tenant's own self-contained compose.yml (one vault, one port
  # set, one container set per customer) and expects ONE shared Caddy
  # container - named `freehand-caddy` - that imports every tenant's
  # Caddyfile.site. See docs/deployment/tenant-provisioning.md.
  caddy:
    image: caddy:2-alpine
    container_name: freehand-caddy
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    extra_hosts:
      # Lets the tenant vhosts reach a tenant's FreeHand port, which is
      # published on the HOST's 127.0.0.1. Without this, Caddy's own
      # loopback is used and every proxy returns 502.
      - "host.docker.internal:host-gateway"
    volumes:
      # The shared Caddyfile imports every tenant vhost from ./caddy/sites.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      # Caddy's own state (TLS certs, ACME account) must persist across
      # restarts or it re-requests certificates on every boot.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  oc-data:
    # OC's own SQLite store. Anonymous Docker volume (managed by Docker,
    # not by host filesystem). Survives `docker compose down` but is
    # removed by `docker compose down -v`.
    name: freehand-oc-data
  caddy-data:
    # Caddy's TLS certificates and ACME account. Deleting this volume
    # forces every tenant to re-issue its certificate.
    name: freehand-caddy-data
  caddy-config:
    name: freehand-caddy-config
  hindsight-data:
    # Hindsight's database: everything FreeHand remembers. Named
    # "hindsight-data" so an existing Hindsight install's memories carry
    # over. `docker compose down -v` deletes it - and the memories.
    name: hindsight-data
