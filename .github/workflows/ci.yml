name: Test on multiple OS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from core.database import init_db
          init_db()
          "

      - name: Run core tests
        # Round 14: CI ran `python test_all.py` — a Round-7-era
        # 7-endpoint smoke script, NOT the pytest suite. The 372+
        # tests in tests/ were never exercised by CI. Point at
        # pytest; the "Initialize database" step above remains as
        # the fresh-checkout init_db() canary.
        run: python -m pytest tests/ -v --tb=short
