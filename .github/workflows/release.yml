name: Build & Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The one-line installs come from the newest release, so a person
      # always gets a tested set:
      #   releases/latest/download/install.sh   (Linux)
      #   releases/latest/download/install.ps1  (Windows)
      #   releases/latest/download/compose.yml  (what install.sh sets up)
      - name: Add the install files
        run: |
          mkdir -p install-files
          cp scripts/install.sh scripts/install.ps1 install/compose.yml install-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            install-files/*
          generate_release_notes: true
          draft: false

  # A release made here, with GitHub's own token, doesn't set off other
  # workflows (GitHub's rule against loops), so PyPI is called directly.
  pypi:
    needs: release
    uses: ./.github/workflows/publish-pypi.yml
    secrets: inherit
