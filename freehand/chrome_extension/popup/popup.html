<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeHand Browser Bridge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 320px; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
  h1 { font-size: 14px; color: #cba6f7; margin-bottom: 12px; }
  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #585b70; }
  .dot.active { background: #a6e3a1; box-shadow: 0 0 6px #a6e3a1; }
  .dot.inactive { background: #f38ba8; }
  .info { font-size: 12px; color: #6c7086; margin-bottom: 4px; }
  .info span { color: #89dceb; }
  .section { background: #313244; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .section-title { font-size: 11px; text-transform: uppercase; color: #6c7086; margin-bottom: 8px; }
  .btn { width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 6px; }
  .btn.primary { background: #89b4fa; color: #1e1e2e; }
  .btn.danger { background: #f38ba8; color: #1e1e2e; }
  .btn.secondary { background: #45475a; color: #cdd6f4; }
  .footer { font-size: 10px; color: #6c7086; text-align: center; }
  .footer a { color: #89b4fa; }
</style>
</head>
<body>

<h1>🦅 FreeHand Browser Bridge</h1>

<div class="status">
  <div class="dot" id="dot"></div>
  <span id="status-text">Checking connection...</span>
</div>

<div class="section">
  <div class="section-title">Connection</div>
  <div class="info">FreeHand server: <span id="server-status">checking...</span></div>
  <div class="info">Active tabs: <span id="tab-count">—</span></div>
  <div class="info">Attached tabs: <span id="attached-count">—</span></div>
</div>

<div class="section">
  <div class="section-title">Quick Actions</div>
  <button class="btn primary" id="btn-attach">🔗 Attach to Current Tab</button>
  <button class="btn secondary" id="btn-refresh">🔄 Refresh Status</button>
</div>

<div class="section">
  <div class="section-title">Setup</div>
  <p class="info" style="margin-bottom:8px">If the status shows "not connected":</p>
  <button class="btn secondary" id="btn-help">📖 View Setup Guide</button>
</div>

<div class="footer">
  FreeHand v0.1.9+ &bull; <a href="https://github.com/TracySmithConsulting/freehand" target="_blank">GitHub</a>
</div>

<script src="popup.js"></script>
</body>
</html>
